load_time_program_profile:
  name: "Use profile as draft"
  description: "Copy user profile or read-only factory preset into draft and clear approvals. Factory presets require loaded metadata for the selected program and resolve only verified mode mappings. Apply profile shortcut must then fresh-validate, review diff/warnings and explicitly confirm through apply_time_program."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    profile_id:
      name: "Profile ID"
      description: "User profile UUID or factory_default_heating / factory_default_hot_water. Factory presets require loaded metadata for the selected program."
      required: true
      selector:
        text: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
      name: "Editor session ID"
      description: "Exact session_id from the latest editor snapshot."
      required: true
      selector:
        text: {}
    read_only:
      name: "Allow read-only profile preview"
      description: "Load without a compatible baseline for numeric editing only. Fresh validation still required."
      required: false
      selector:
        boolean: {}
set_time_program_mode_mapping:
  name: "Confirm numeric mode mapping"
  description: "Persist display mapping bound to program metadata, controller and firmware. Invalidates approval, never translates numeric codes or writes to pump."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    program_index:
      name: "Program index"
      description: "0 = hot water; 2 = heating."
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    mapping:
      name: "Numeric-to-semantic mapping"
      description: "Optional override; omit to use the verified firmware 2.03N default. Exactly keys 0..nos-1. Heating: 0 setback, 1 normal, 2 boost. DHW: 0 minimum (Off), 1 charging (On). Null remains unverified. Numeric payloads are never translated."
      required: true
      selector:
        object: {}
    expected_mapping_revision:
      name: "Expected mapping revision"
      description: "Exact mapping_revision; 0 before first mapping."
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    confirmed:
      name: "Confirm controller mapping"
      description: "True only after explicitly verifying these codes on this controller and firmware."
      required: true
      selector:
        boolean: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
      name: "Editor session ID"
      description: "Exact session_id from the latest editor snapshot."
      required: false
      selector:
        text: {}

get_current_time_program:
  name: "Read current schedule"
  description: "Read-only; reuse a baseline or coordinator cache up to 180 seconds old. Never changes draft, revision or approval."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      required: true
      selector:
        config_entry:
          integration: "htha"
    program_index:
      name: "Program index (0 hot water, 2 heating)"
      required: true
      selector:
        select:
          options: ["0","2"]
    force:
      name: "Reload from pump"
      required: false
      default: false
      selector:
        boolean: {}

start_time_program_draft:
  name: "Start schedule draft"
  description: "Explicitly copy current schedule or selected profile with the current pump baseline. Clears approval; never writes hardware."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      required: true
      selector:
        config_entry:
          integration: "htha"
    program_index:
      name: "Program index (0 hot water, 2 heating)"
      required: true
      selector:
        select:
          options: ["0","2"]
    expected_draft_revision:
      name: "Expected editor revision"
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: "box"
    session_id:
      name: "Editor session ID"
      required: true
      selector:
        text: {}
    profile_id:
      name: "Starting profile ID (omit for current schedule)"
      required: false
      selector:
        text: {}

discard_time_program_draft:
  name: "Discard schedule draft"
  description: "Close the shared server draft with revision/session conflict protection. Never writes hardware."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      required: true
      selector:
        config_entry:
          integration: "htha"
    expected_draft_revision:
      name: "Expected editor revision"
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: "box"
    session_id:
      name: "Editor session ID"
      required: true
      selector:
        text: {}
