load_time_program_draft:
  name: "Load pump schedule into draft"
  description: "Read only. Replace draft, clear approvals."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    program_index:
      name: "Program index"
      description: "0 = hot water; 2 = heating."
      required: true
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
      name: "Editor session ID"
      description: "Exact session_id from the latest editor snapshot."
      required: false
      selector:
        text: {}
validate_time_program:
  name: "Validate schedule and compare"
  description: "No writes. Canonicalize, check full week and mapping, return numeric diff; fresh_read reads baseline under the manager lock."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    draft:
      name: "Complete weekly draft"
      description: "Seven arrays of ordered start/end HH:MM and integer state, covering 00:00–24:00. At most 96 runs/day; native capacity checked after merge."
      required: true
      selector:
        object: {}
    policy:
      name: "Validation policy"
      description: "kind, normal_state, mapping_confirmed, floor_heating. The editor derives Normal/On from the active mapping. Firmware 2.03N uses the verified default; no separate Normal-code checkbox is needed."
      required: true
      selector:
        object: {}
    fresh_read:
      name: "Fresh baseline read"
      description: "Read-only refresh under manager lock, retain submitted draft; failure revokes approval."
      required: false
      selector:
        boolean: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
      name: "Editor session ID"
      description: "Exact session_id from the latest editor snapshot."
      required: false
      selector:
        text: {}
    expected_mapping_revision:
      name: "Expected mapping revision"
      description: "Exact mapping_revision; 0 before first mapping."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
acknowledge_time_program_warnings:
  name: "Acknowledge checked warnings"
  description: "Review all warnings and acknowledge exactly their IDs bound to the checked hash."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    draft_hash:
      name: "Checked hash"
      description: "Exact draft_hash from the current check; binds payload, metadata, policy, mapping, baseline and session."
      required: true
      selector:
        text: {}
    warning_ids:
      name: "Warning IDs"
      description: "Exactly all warning_ids after individually reviewing every warning."
      required: true
      selector:
        object: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
