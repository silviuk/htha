list_time_program_profiles:
  name: "List schedule profiles"
  description: "Category-filtered user profiles and a read-only Factory default (Heliotherm) preset, with library revision. No pump calls."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    category:
      name: "Category"
      description: "heating or hot_water; separate profile catalogs."
      required: true
      selector:
        select:
          options: [heating, hot_water]
save_time_program_profile:
  name: "Save schedule profile in HA"
  description: "Create or explicitly update by UUID/revision. Maximum 50 per category. Capacity/risk-invalid work may be saved; no approval is stored. Success only after durable Store save."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    category:
      name: "Category"
      description: "heating or hot_water; separate profile catalogs."
      required: true
      selector:
        select:
          options: [heating, hot_water]
    name:
      name: "Profile name"
      description: "Trimmed plain text, 1–80 characters. Names are unique case-insensitively per category."
      required: true
      selector:
        text: {}
    draft:
      name: "Complete weekly draft"
      description: "Seven arrays of ordered start/end HH:MM and integer state, covering 00:00–24:00. At most 96 runs/day; native capacity checked after merge."
      required: true
      selector:
        object: {}
    profile_id:
      name: "Profile UUID"
      description: "UUID of an existing profile in this entry. Omit only for Save as/create."
      required: false
      selector:
        text: {}
    expected_profile_revision:
      name: "Expected profile revision"
      description: "Exact revision for update/rename/delete; stale updates conflict."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    description:
      name: "Description"
      description: "Optional plain text, at most 1000 characters."
      required: false
      selector:
        text: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
      name: "Editor session ID"
      description: "Exact session_id from the latest editor snapshot."
      required: false
      selector:
        text: {}
