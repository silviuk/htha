      description: "Exact session_id from the latest editor snapshot."
      required: false
      selector:
        text: {}
apply_time_program:
  name: "Send checked schedule"
  description: "Admin only. Requires Allow writes, valid check, all used mode mappings, exact acknowledgements and explicit confirmation. Durable recovery and independent read-back; no automatic retry/rollback."
  fields:
    config_entry_id:
      name: "HTHA entry ID"
      description: "Loaded HTHA integration entry."
      required: true
      selector:
        config_entry:
          integration: htha
    draft:
      name: "Complete weekly draft"
      description: "Seven arrays of ordered start/end HH:MM and integer state, covering 00:00–24:00. At most 96 runs/day; native capacity checked after merge."
      required: true
      selector:
        object: {}
    draft_hash:
      name: "Checked hash"
      description: "Exact draft_hash from the current check; binds payload, metadata, policy, mapping, baseline and session."
      required: true
      selector:
        text: {}
    confirm:
      name: "Explicit confirmation"
      description: "Must be true. Deleting profiles affects only the HA library. Apply/restore are the only schedule-write workflows."
      required: true
      selector:
        boolean: {}
    expected_draft_revision:
      name: "Expected editor revision"
      description: "Exact snapshot revision; stale tabs conflict. Optional for legacy services; required when loading profiles."
      required: false
      selector:
        number:
          min: 0
          max: 2147483647
          mode: box
    session_id:
